# Shadow evaluation with vally — runs alongside skill-validator for comparison.
#
# This workflow reuses the gate and discover jobs from evaluation.yml via
# workflow_call, or can be triggered manually. Results are informational
# only — they never gate PRs.
#
# Rate-limit strategy (why this workflow shards instead of matrixing per skill):
# the discover job emits one entry per changed (plugin, skill), which on a
# large PR is ~85+ entries. Fanning those out as one CI job each — every job
# calling `vally experiment run --workers 5` — storms the Copilot backend from
# only two tokens and trips rate limits. Instead we run a SINGLE vally
# experiment across all targeted skills and split the work with vally's native
# trial-level sharding (`vally experiment run --shard i/N --run-id <id>`), then
# reconcile the shard outputs with `vally experiment merge`. Concurrency is
# bounded by an adaptive shard count (<= MAX_SHARDS), the shard matrix'
# max-parallel, and --workers per shard, so total concurrent Copilot sessions
# stay small regardless of PR size.
#
# NOTE: This is a transitional workflow for the replat. It will be removed
# once vally fully replaces skill-validator.
name: vally-evaluation

on:
  # Triggered by the main evaluation workflow after discover completes
  workflow_call:
    inputs:
      entries:
        description: 'JSON array of matrix entries from discover job'
        required: true
        type: string
      head_sha:
        description: 'PR head SHA to checkout'
        required: false
        type: string
        default: ''
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin to evaluate (e.g., dotnet-maui)'
        required: true
        type: string
      skill:
        description: 'Skill to evaluate (optional, evaluates whole plugin if empty)'
        required: false
        type: string

env:
  # Fallback model/judge used only if the experiment file's `overrides:` block
  # can't be parsed. The experiment file is the source of truth (see below).
  FALLBACK_MODEL: claude-opus-4.6
  FALLBACK_JUDGE_MODEL: claude-opus-4.6
  # Concurrency budget. Peak concurrent Copilot sessions is roughly
  # (shard matrix max-parallel) * WORKERS_PER_SHARD, spread across the
  # available tokens. Adaptive shard count keeps small PRs cheap while capping
  # large PRs at MAX_SHARDS.
  MAX_SHARDS: '8'
  EVALS_PER_SHARD: '8'
  WORKERS_PER_SHARD: '5'
  # How many `vally compare` judge calls the merge job runs at once when
  # converting merged results into per-skill verdicts.
  COMPARE_CONCURRENCY: '5'

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Plan: turn the discover entries (or the dispatch inputs) into a single set
  # of --eval-filter patterns, size the shard count from the eval total, and
  # emit a stable run id shared by every shard.
  # --------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      has_work: ${{ steps.plan.outputs.has_work }}
      run_id: ${{ steps.plan.outputs.run_id }}
      shards: ${{ steps.plan.outputs.shards }}
      filters_b64: ${{ steps.plan.outputs.filters_b64 }}
      model: ${{ steps.plan.outputs.model }}
      judge_model: ${{ steps.plan.outputs.judge_model }}
    steps:
      - name: Checkout skills content
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha || '' }}
          persist-credentials: false

      - name: Plan shards
        id: plan
        env:
          ENTRIES: ${{ inputs.entries || '[]' }}
          DISPATCH_PLUGIN: ${{ inputs.plugin }}
          DISPATCH_SKILL: ${{ inputs.skill }}
        run: |
          set -euo pipefail

          # Collect --eval-filter patterns. Each pattern is intersected by vally
          # with the experiment's `evals:` glob, so `agent.*` skills (excluded
          # from that glob) are dropped here to avoid a match-nothing hard error.
          PATTERNS=()
          add_skill_filter() {
            case "$2" in
              agent.*) return 0 ;;
            esac
            PATTERNS+=("tests/$1/$2/eval.vally.yaml")
          }

          if [ -n "$DISPATCH_PLUGIN" ]; then
            if [ -n "$DISPATCH_SKILL" ]; then
              add_skill_filter "$DISPATCH_PLUGIN" "$DISPATCH_SKILL"
            else
              PATTERNS+=("tests/$DISPATCH_PLUGIN/**/eval.vally.yaml")
            fi
          else
            # Expand every discover entry's skills_path token into a filter:
            #   plugins/<plugin>/skills          -> tests/<plugin>/**   (whole plugin)
            #   plugins/<plugin>/skills/<skill>  -> tests/<plugin>/<skill>
            while IFS= read -r token; do
              [ -n "$token" ] || continue
              rel="${token#plugins/}"          # <plugin>/skills[/<skill>]
              tp="${rel%%/skills*}"            # <plugin>
              skill="${rel#*/skills}"          # "" or "/<skill>"
              skill="${skill#/}"               # "" or "<skill>"
              if [ -n "$skill" ]; then
                add_skill_filter "$tp" "$skill"
              else
                PATTERNS+=("tests/$tp/**/eval.vally.yaml")
              fi
            done < <(printf '%s' "$ENTRIES" | jq -r '.[].skills_path // empty')
          fi

          # Dedupe patterns.
          if [ ${#PATTERNS[@]} -gt 0 ]; then
            mapfile -t PATTERNS < <(printf '%s\n' "${PATTERNS[@]}" | awk 'NF' | sort -u)
          fi

          # Expand patterns to concrete, declared (non-agent) eval files purely
          # to size the shard count.
          FILES=()
          for p in "${PATTERNS[@]:-}"; do
            [ -n "$p" ] || continue
            case "$p" in
              *'**'*)
                base="${p%%/'**'*}"          # tests/<plugin>
                if [ -d "$base" ]; then
                  while IFS= read -r f; do FILES+=("$f"); done \
                    < <(find "$base" -type f -name 'eval.vally.yaml' | grep -v '/agent\.' || true)
                fi
                ;;
              *)
                [ -f "$p" ] && FILES+=("$p")
                ;;
            esac
          done
          if [ ${#FILES[@]} -gt 0 ]; then
            mapfile -t FILES < <(printf '%s\n' "${FILES[@]}" | awk 'NF' | sort -u)
          fi
          TOTAL=${#FILES[@]}

          if [ "$TOTAL" -eq 0 ]; then
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo "No vally evals matched — nothing to run."
            exit 0
          fi

          # Adaptive shard count: ~EVALS_PER_SHARD evals per shard, capped at MAX_SHARDS.
          N=$(( (TOTAL + EVALS_PER_SHARD - 1) / EVALS_PER_SHARD ))
          [ "$N" -lt 1 ] && N=1
          [ "$N" -gt "$MAX_SHARDS" ] && N="$MAX_SHARDS"

          SHARDS=$(for i in $(seq 1 "$N"); do echo "$i/$N"; done | jq -R . | jq -sc .)
          RUN_ID=$(uuidgen 2>/dev/null || cat /proc/sys/kernel/random/uuid)
          FILTERS_B64=$(printf '%s\n' "${PATTERNS[@]}" | base64 -w0)

          # Model + comparison-judge model come from the experiment file's
          # `overrides:` block (single source of truth), matching run-vally-evals.sh.
          read_override() {
            awk -v k="$1" '
              /^overrides:/ { f = 1; next }
              /^[^[:space:]]/ { f = 0 }
              f && $1 == k":" { print $2; exit }
            ' dotnet-skills.experiment.yaml
          }
          MODEL="$(read_override model)"; MODEL="${MODEL:-$FALLBACK_MODEL}"
          JUDGE_MODEL="$(read_override judge_model)"; JUDGE_MODEL="${JUDGE_MODEL:-$FALLBACK_JUDGE_MODEL}"

          {
            echo "has_work=true"
            echo "run_id=$RUN_ID"
            echo "shards=$SHARDS"
            echo "filters_b64=$FILTERS_B64"
            echo "model=$MODEL"
            echo "judge_model=$JUDGE_MODEL"
          } >> "$GITHUB_OUTPUT"

          echo "Planned $TOTAL eval(s) across $N shard(s); run_id=$RUN_ID"
          printf 'Filters:\n%s\n' "$(printf '%s\n' "${PATTERNS[@]}")"

  # --------------------------------------------------------------------------
  # Shard: each job plans the whole experiment but executes only its trial
  # slice (vally native --shard). max-parallel + --workers bound concurrency.
  # --------------------------------------------------------------------------
  shard:
    needs: [plan]
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    name: vally shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - name: Checkout skills content
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha || '' }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install vally
        run: npm install -g @microsoft/vally-cli

      - name: Select Copilot token
        id: select-token
        env:
          TOKEN_1: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          TOKEN_2: ${{ secrets.COPILOT_GITHUB_TOKEN_2 }}
        run: |
          TOKENS=()
          for i in 1 2; do
            var="TOKEN_$i"
            val="${!var}"
            if [ -n "$val" ]; then TOKENS+=("$val"); fi
          done
          if [ ${#TOKENS[@]} -eq 0 ]; then
            echo "::error::No COPILOT_GITHUB_TOKEN secrets are configured"
            exit 1
          fi
          IDX=$(( ${RANDOM} % ${#TOKENS[@]} ))
          echo "::add-mask::${TOKENS[$IDX]}"
          echo "token=${TOKENS[$IDX]}" >> $GITHUB_OUTPUT

      - name: Run vally shard
        id: run
        env:
          GITHUB_TOKEN: ${{ steps.select-token.outputs.token }}
          RUN_ID: ${{ needs.plan.outputs.run_id }}
          SHARD: ${{ matrix.shard }}
          FILTERS_B64: ${{ needs.plan.outputs.filters_b64 }}
          WORKERS: ${{ env.WORKERS_PER_SHARD }}
        run: |
          set -uo pipefail
          mapfile -t PATTERNS < <(printf '%s' "$FILTERS_B64" | base64 -d)
          FILTER_ARGS=()
          for p in "${PATTERNS[@]}"; do
            [ -n "$p" ] && FILTER_ARGS+=(--eval-filter "$p")
          done

          mkdir -p out
          vally experiment run dotnet-skills.experiment.yaml \
            "${FILTER_ARGS[@]}" \
            --run-id "$RUN_ID" \
            --shard "$SHARD" \
            --workers "$WORKERS" \
            --output-dir "$PWD/out" \
            2>&1 || echo "::warning::vally experiment run reported failures for shard $SHARD"

          SHARD_DIR=$(find "out/$RUN_ID" -mindepth 1 -maxdepth 1 -type d -name 'shard-*-of-*' | sort | head -1)
          if [ -z "$SHARD_DIR" ]; then
            echo "::error::shard $SHARD produced no output directory under out/$RUN_ID"
            exit 1
          fi
          echo "shard_dir=$SHARD_DIR" >> "$GITHUB_OUTPUT"
          echo "Shard $SHARD output: $SHARD_DIR"

      - name: Upload shard output
        if: always() && steps.run.outputs.shard_dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vally-shard-${{ strategy.job-index }}
          path: ${{ steps.run.outputs.shard_dir }}
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Merge: reconcile shard outputs with `vally experiment merge`, then run the
  # adapter to produce per-skill verdicts and the shadow summary.
  # --------------------------------------------------------------------------
  merge:
    needs: [plan, shard]
    if: always() && !cancelled() && needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - name: Checkout skills content
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha || '' }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install vally
        run: npm install -g @microsoft/vally-cli

      - name: Select Copilot token
        id: select-token
        env:
          TOKEN_1: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          TOKEN_2: ${{ secrets.COPILOT_GITHUB_TOKEN_2 }}
        run: |
          TOKENS=()
          for i in 1 2; do
            var="TOKEN_$i"
            val="${!var}"
            if [ -n "$val" ]; then TOKENS+=("$val"); fi
          done
          if [ ${#TOKENS[@]} -eq 0 ]; then
            echo "::error::No COPILOT_GITHUB_TOKEN secrets are configured"
            exit 1
          fi
          IDX=$(( ${RANDOM} % ${#TOKENS[@]} ))
          echo "::add-mask::${TOKENS[$IDX]}"
          echo "token=${TOKENS[$IDX]}" >> $GITHUB_OUTPUT

      - name: Download shard outputs
        uses: actions/download-artifact@448e3f862ab3ef47aa50ff917776823c9946035b # v8
        with:
          pattern: vally-shard-*
          path: shards

      - name: Merge and adapt
        id: merge
        env:
          GITHUB_TOKEN: ${{ steps.select-token.outputs.token }}
          MODEL: ${{ needs.plan.outputs.model }}
          JUDGE_MODEL: ${{ needs.plan.outputs.judge_model }}
          COMPARE_CONCURRENCY: ${{ env.COMPARE_CONCURRENCY }}
          RESULTS_DIR: artifacts/TestResults/vally
        run: |
          set -uo pipefail

          SHARD_DIRS=()
          while IFS= read -r d; do SHARD_DIRS+=("$d"); done \
            < <(find shards -mindepth 1 -maxdepth 1 -type d | sort)
          if [ ${#SHARD_DIRS[@]} -eq 0 ]; then
            echo "::warning::No shard artifacts were downloaded — nothing to merge."
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Merging ${#SHARD_DIRS[@]} shard(s):"
          printf '  %s\n' "${SHARD_DIRS[@]}"

          vally experiment merge "${SHARD_DIRS[@]}" -o merged \
            2>&1 || echo "::warning::vally experiment merge reported variant failures"

          if ! find merged -name 'results.jsonl' | grep -q .; then
            echo "::warning::merge produced no results.jsonl — skilled/baseline runs failed to validate (see shard logs)"
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Split the merged per-variant output by eval and run `vally compare`
          # per skill (in the adapter) to produce the per-skill results.json the
          # shadow summary consumes. `vally` is on PATH here.
          node eng/vally-adapter/adapt.mjs \
            --experiment-dir merged \
            --output-root "$RESULTS_DIR" \
            --vally "vally" \
            --model "$MODEL" \
            --judge-model "$JUDGE_MODEL" \
            --compare-concurrency "$COMPARE_CONCURRENCY"

          PRODUCED=$(find "$RESULTS_DIR" -name results.json | wc -l | tr -d ' ')
          echo "Produced $PRODUCED skill verdict(s)"
          echo "has_results=true" >> "$GITHUB_OUTPUT"
          if [ "$PRODUCED" -eq 0 ]; then
            echo "::warning::vally produced no skill verdicts — evals failed to run or validate (see logs above)"
          fi

      - name: Upload results
        if: always() && steps.merge.outputs.has_results == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vally-results
          path: artifacts/TestResults/vally/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

      - name: Write summary
        if: always() && steps.merge.outputs.has_results == 'true'
        run: |
          echo "## 🔬 Vally Shadow Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Skilled vs baseline, judged head-to-head by \`vally compare\`. A skill passes only on a credible improvement (mean preference > 0 with its 95% CI above 0)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          RESULTS_DIR="artifacts/TestResults/vally"
          while IFS= read -r RESULTS_JSON; do
            if [ ! -f "$RESULTS_JSON" ]; then continue; fi
            EVAL_NAME=$(basename $(dirname "$RESULTS_JSON"))

            PASSED=$(node -e "const r=JSON.parse(require('fs').readFileSync('$RESULTS_JSON','utf-8')); console.log(r.verdicts[0].passed)")
            REASON=$(node -e "const r=JSON.parse(require('fs').readFileSync('$RESULTS_JSON','utf-8')); console.log(r.verdicts[0].reason)")
            ICON=$([ "$PASSED" = "true" ] && echo "✅" || echo "❌")

            echo "### $ICON $EVAL_NAME" >> $GITHUB_STEP_SUMMARY
            echo "$REASON" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Per-scenario table: mean preference score and win/tie/loss.
            echo "| Scenario | Mean preference | Trials (W/T/L) |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-----------------|----------------|" >> $GITHUB_STEP_SUMMARY
            node -e "
              const r = JSON.parse(require('fs').readFileSync('$RESULTS_JSON', 'utf-8'));
              for (const s of r.verdicts[0].scenarios) {
                const icon = s.meanScore > 0 ? '▲' : s.meanScore < 0 ? '▼' : '=';
                const pct = (s.meanScore >= 0 ? '+' : '') + (s.meanScore * 100).toFixed(1) + '%';
                let w=0,t=0,l=0;
                for (const tr of (s.trials||[])) { if (tr.score>0) w++; else if (tr.score<0) l++; else t++; }
                console.log('| ' + icon + ' ' + s.scenarioName + ' | ' + pct + ' | ' + w + '/' + t + '/' + l + ' |');
              }
            " >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done < <(find "$RESULTS_DIR" -name results.json | sort)
